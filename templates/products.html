{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h2>Products</h2>
</div>
<div class="products-grid">

    {% for product in products %}
    <div class="product-card">
        <img src="{{ url_for('static', filename=product.image_path if product.image_path else 'uploads/products/default.jpg') }}" class="product-img">
        <h3>{{ product.name }}</h3>
        <p class="price">₹ {{ product.price }}</p>
        <div class="card-actions">
            <button class="edit-btn" onclick="openEditModal(
                {{ product.id }},
                '{{ product.name }}',
                {{ product.price }},
                {{ product.stock }},
                {{ product.gst_percent }}
            )">
                Edit
            </button>
            <button class="delete-btn" onclick="openDeleteModal({{ product.id }})">Delete</button>
        </div>
    </div>
    
    {% endfor %}
</div>
<div class="add-product-wrapper">
    <button onclick="openForm()" class="add-btn">+ Add Product</button>
</div>
<div id="productModal" class="modal">

    <div class="modal-box">

        <span class="close-btn" onclick="closeForm()">×</span>

        <h2>Add Product</h2>

        <form action="/api/products/add" method="POST" enctype="multipart/form-data">

            <input type="text" name="name" placeholder="Product Name" required>

            <input type="number" name="price" placeholder="Price" required>
            <input type="number" name="stock" placeholder="Stock" required>
            <input type="number" name="gst_percent" placeholder="Gst Percent">
            <input type="file" name="image" placeholder="Upload Image" required class="img-up">
            <button type="submit" class="save-btn">Save Product</button>

        </form>

    </div>
    

</div>
<div id="deleteModal" class="modal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeDeleteModal()">×</span>

            <h2>Delete Product</h2>
            <p>Are you sure you want to delete this product?</p>

            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="delete-btn" onclick="confirmDelete()">Yes, Delete</button>
                <button class="edit-btn" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
</div>
<div id="editModal" class="modal">
    <div class="modal-box">
    

        <span class="close-btn" onclick="closeEditModal()">×</span>

        <h2>Edit Product</h2>

        <form id="editForm" enctype="multipart/form-data">

            <input type="hidden" id="edit-id">

            <input type="text" id="edit-name" placeholder="Product Name" required>
            <input type="number" id="edit-price" placeholder="Price" required>
            <input type="number" id="edit-stock" placeholder="Stock" required>
            <input type="number" id="edit-gst" placeholder="GST Percent">
            <input type="file" id="edit-image" class="img-up">

            <button type="submit" class="save-btn">Update Product</button>

        </form>

    </div>
</div>

<script src="{{ url_for('static', filename='js/products.js') }}"></script>
{% endblock %}
